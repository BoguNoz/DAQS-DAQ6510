
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daqs-ingress
  namespace: daqs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 12345
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
