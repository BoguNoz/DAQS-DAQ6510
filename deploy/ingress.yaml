apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daqs
  namespace: bogunoz-services-thermo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: daqs
                port:
                  number: 12345
