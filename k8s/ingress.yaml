apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daqs-ingress
  namespace: daqs
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
        - path: /ws
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 12345
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80