apiVersion: apps/v1
kind: Deployment
metadata:
  name: daqs
  namespace: bogunoz-services-thermo
spec:
  replicas: 1
  # Recreate: jedna instancja naraz (init bazy przy starcie, docelowo jeden klient przyrządu)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: daqs
  template:
    metadata:
      labels:
        app: daqs
    spec:
      containers:
        - name: daqs
          image: ghcr.io/bogunoz-services/daqs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 12345
          readinessProbe:
            tcpSocket:
              port: 12345
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: daqs-db-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: daqs-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daqs-db-secret
                  key: DB_PASSWORD
